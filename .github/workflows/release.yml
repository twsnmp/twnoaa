name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows/amd64
            os: windows-latest
            artifact_name: twnoaa-windows-amd64.zip
            tags: ""
          - platform: linux/amd64
            os: ubuntu-24.04
            artifact_name: twnoaa-linux-amd64.tar.gz
            tags: "-tags webkit2_41"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config librtlsdr-dev

      - name: Setup MSYS2 (Windows)
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-rtl-sdr

      - name: Configure Windows Environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msysRoot = "${{ steps.msys2.outputs.msys2-location }}"
          $ucrtRoot = "$msysRoot/ucrt64" -replace '\\', '/'
          Write-Host "MSYS2 UCRT root: $ucrtRoot"
          "$ucrtRoot/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CC=$ucrtRoot/bin/gcc.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CGO_ENABLED=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CGO_CFLAGS=-I$ucrtRoot/include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CGO_LDFLAGS=-L$ucrtRoot/lib -lrtlsdr" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG_PATH=$ucrtRoot/lib/pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Generate Wails Bindings
        shell: bash
        run: |
          mkdir -p frontend/dist
          touch frontend/dist/index.html
          wails generate module

      - name: Build Frontend
        shell: bash
        run: |
          cd frontend
          npm install
          npm run build

      - name: Build Wails App (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          TAG="${{ inputs.tag_name }}"
          if [ -n "$TAG" ]; then
            VERSION="$TAG"
          else
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.0")
          fi
          COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          BUILD_VERSION="${VERSION}(${COMMIT})"
          echo "Building Linux version: ${BUILD_VERSION}"
          wails build -platform ${{ matrix.platform }} -clean -s ${{ matrix.tags }} -ldflags "-X main.version=${BUILD_VERSION}"

      - name: Build Wails App (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag_name }}"
          if ($tag) {
            $version = $tag
          } else {
            $version = git describe --tags --abbrev=0 2>$null
            if (-not $version) { $version = "v0.1.0" }
          }
          $commit = git rev-parse --short HEAD 2>$null
          if (-not $commit) { $commit = "unknown" }
          $buildVersion = "${version}(${commit})"
          Write-Host "Building Windows version: ${buildVersion}"
          wails build -platform ${{ matrix.platform }} -clean -s -ldflags "-X main.version=${buildVersion}"

      - name: Package Release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msysRoot = "${{ steps.msys2.outputs.msys2-location }}"
          $binDir = "$msysRoot\ucrt64\bin"
          # Copy required runtime DLLs next to executable
          $dlls = @(
            "$binDir\librtlsdr*.dll",
            "$binDir\libusb-1.0*.dll",
            "$binDir\libwinpthread-1.dll",
            "$binDir\libgcc_s_seh-1.dll"
          )
          foreach ($pattern in $dlls) {
            Get-Item $pattern -ErrorAction SilentlyContinue | ForEach-Object {
              Copy-Item $_.FullName -Destination "build\bin\" -Force
              Write-Host "Copied $($_.Name) to build\bin\"
            }
          }
          # Ensure rtlsdr.dll exists for compatibility
          if (Test-Path "build\bin\librtlsdr.dll") {
            Copy-Item "build\bin\librtlsdr.dll" -Destination "build\bin\rtlsdr.dll" -Force
          } elseif (Test-Path "build\bin\librtlsdr-0.dll") {
            Copy-Item "build\bin\librtlsdr-0.dll" -Destination "build\bin\rtlsdr.dll" -Force
            Copy-Item "build\bin\librtlsdr-0.dll" -Destination "build\bin\librtlsdr.dll" -Force
          }

          # Compress all binaries and DLLs into a zip
          Compress-Archive -Path build\bin\* -DestinationPath ${{ matrix.artifact_name }}

      - name: Package Release (Linux)
        if: runner.os == 'Linux'
        run: |
          # Compress the compiled binary from build/bin into a tar.gz
          tar -czvf ${{ matrix.artifact_name }} -C build/bin twnoaa

      - name: Upload artifact for release job
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          draft: false
          prerelease: false
          tag_name: ${{ inputs.tag_name || (github.ref_type == 'tag' && github.ref_name) || 'v0.1.0' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
