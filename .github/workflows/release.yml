name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows/amd64
            os: windows-latest
            artifact_name: twnoaa-windows-amd64.zip
            tags: ""
          - platform: linux/amd64
            os: ubuntu-24.04
            artifact_name: twnoaa-linux-amd64.tar.gz
            tags: "-tags webkit2_41"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config librtlsdr-dev

      - name: Setup Windows RTL-SDR dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\rtlsdr | Out-Null
          $zipUrl = "https://github.com/rtlsdrblog/rtl-sdr-blog/releases/latest/download/Release.zip"
          $zipPath = "$env:RUNNER_TEMP\Release.zip"
          Invoke-WebRequest -Uri $zipUrl -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath "$env:RUNNER_TEMP\rtlsdr-extracted" -Force
          Copy-Item -Path "$env:RUNNER_TEMP\rtlsdr-extracted\x64\*" -Destination "C:\rtlsdr" -Recurse -Force

          # Download C headers
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/rtlsdrblog/rtl-sdr-blog/master/include/rtl-sdr.h" -OutFile "C:\rtlsdr\rtl-sdr.h"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/rtlsdrblog/rtl-sdr-blog/master/include/rtl-sdr_export.h" -OutFile "C:\rtlsdr\rtl-sdr_export.h"

          echo "C:\rtlsdr" >> $env:GITHUB_PATH
          echo "CGO_ENABLED=1" >> $env:GITHUB_ENV
          echo "CGO_CFLAGS=-IC:/rtlsdr" >> $env:GITHUB_ENV
          echo "CGO_LDFLAGS=-LC:/rtlsdr -lrtlsdr" >> $env:GITHUB_ENV

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Generate Wails Bindings
        shell: bash
        run: |
          mkdir -p frontend/dist
          touch frontend/dist/index.html
          wails generate module

      - name: Build Frontend
        shell: bash
        run: |
          cd frontend
          npm install
          npm run build

      - name: Build Wails App (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          TAG="${{ inputs.tag_name }}"
          if [ -n "$TAG" ]; then
            VERSION="$TAG"
          else
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.0")
          fi
          COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          BUILD_VERSION="${VERSION}(${COMMIT})"
          echo "Building Linux version: ${BUILD_VERSION}"
          wails build -platform ${{ matrix.platform }} -clean -s ${{ matrix.tags }} -ldflags "-X main.version=${BUILD_VERSION}"

      - name: Build Wails App (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag_name }}"
          if ($tag) {
            $version = $tag
          } else {
            $version = git describe --tags --abbrev=0 2>$null
            if (-not $version) { $version = "v0.1.0" }
          }
          $commit = git rev-parse --short HEAD 2>$null
          if (-not $commit) { $commit = "unknown" }
          $buildVersion = "${version}(${commit})"
          Write-Host "Building Windows version: ${buildVersion}"
          wails build -platform ${{ matrix.platform }} -clean -s -ldflags "-X main.version=${buildVersion}"

      - name: Package Release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Copy required runtime DLLs next to executable
          Copy-Item -Path "C:\rtlsdr\rtlsdr.dll" -Destination "build\bin\" -Force
          if (Test-Path "C:\rtlsdr\pthreadVC2.dll") { Copy-Item -Path "C:\rtlsdr\pthreadVC2.dll" -Destination "build\bin\" -Force }
          if (Test-Path "C:\rtlsdr\msvcr100.dll") { Copy-Item -Path "C:\rtlsdr\msvcr100.dll" -Destination "build\bin\" -Force }

          # Compress all binaries and DLLs into a zip
          Compress-Archive -Path build\bin\* -DestinationPath ${{ matrix.artifact_name }}

      - name: Package Release (Linux)
        if: runner.os == 'Linux'
        run: |
          # Compress the compiled binary from build/bin into a tar.gz
          tar -czvf ${{ matrix.artifact_name }} -C build/bin twnoaa

      - name: Upload artifact for release job
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          draft: false
          prerelease: false
          tag_name: ${{ inputs.tag_name || (github.ref_type == 'tag' && github.ref_name) || 'v0.1.0' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
